<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>art</title>

    <style>

        @font-face {
            font-family: 'CMUNRM';
            src: url('../fonts/cmunrm.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #000000;
            color: #ffffff;
            font-family: 'CMUNRM', serif;
        }

        .back {
            position: fixed;
            top: 25px;
            left: 30px;
            color: #00ffff;
            text-decoration: none;
            font-size: 1.2rem;
            z-index: 100;
        }

        .back:hover {
            color: #ff00ff;
        }

        .art {
            width: 90%;
            margin: 70px auto 60px;
            display: flex;
            gap: 2px;
        }

        .window {
            flex: 1;
            min-width: 0;
            padding: 0 35px 40px;
        }

        .window:first-child {
            border-right: 1px solid #333333;
        }

        .window-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: normal;
            margin: 0 0 40px;
        }

        .link {
            display: block;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .link:hover {
            color: #00ffff;
        }

        /* GALLERY */

        .gallery {
            column-count: 2;
            column-gap: 20px;
        }

        .item {
            break-inside: avoid;
            margin-bottom: 20px;
        }

        .item img,
        .item video {
            width: 100%;
            height: auto;
            display: block;
            background: #111111;
        }

        .item img {
            cursor: zoom-in;
        }

        .item img:hover,
        .item video:hover {
            outline: 1px solid #00ffff;
        }


        /* FULLSCREEN IMAGE */

        .image-viewer {
            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            background: rgba(0, 0, 0, 0.95);

            z-index: 1000;

            align-items: center;
            justify-content: center;

            padding: 30px;

            cursor: zoom-out;
        }

        .image-viewer.active {
            display: flex;
        }

        .image-viewer img {

            max-width: 95vw;
            max-height: 95vh;

            width: auto;
            height: auto;

            object-fit: contain;

            cursor: default;
        }


        /* MOBILE */

        @media (max-width: 700px) {

            .art {
                display: block;
            }

            .window:first-child {
                border-right: none;
                border-bottom: 1px solid #333333;
                margin-bottom: 50px;
            }

            .gallery {
                column-count: 1;
            }

        }

    </style>

</head>


<body>


    <a class="back" href="../index.html">
        ← back
    </a>


    <main class="art">


        <!-- MY ART -->

        <section class="window">

            <h1 class="window-title">
                myart
            </h1>

            <div class="gallery" id="gallery"></div>

        </section>


        <!-- PROJECTS -->

        <section class="window">

            <h1 class="window-title">
                projects i worked on
            </h1>

            <div id="projects"></div>

        </section>


    </main>


    <!-- IMAGE VIEWER -->

    <div class="image-viewer" id="imageViewer">

        <img id="viewerImage" src="" alt="">

    </div>


    <!-- GALLERY & PROJECTS RENDER SCRIPT -->

    <script>

    // 1. GALLERY RENDER
    const files = [
        { "name": "Box.png", "type": "image" },
        { "name": "Box2.png", "type": "image" },
        { "name": "Crystal.png", "type": "image" },
        { "name": "Crystal2.png", "type": "image" },
        { "name": "Floral.png", "type": "image" },
        { "name": "Fold.png", "type": "image" },
        { "name": "Hall.png", "type": "image" },
        { "name": "Horn.png", "type": "image" },
        { "name": "House.png", "type": "image" },
        { "name": "Lamp.png", "type": "image" },
        { "name": "Metalheart_1.png", "type": "image" },
        { "name": "Planet.png", "type": "image" },
        { "name": "Tree.mp4", "type": "video" },
        { "name": "Tree.png", "type": "image" }
    ];

    const gallery = document.getElementById("gallery");

    files.forEach(file => {
        const item = document.createElement("div");
        item.className = "item";

        if (file.type === "image") {
            const image = document.createElement("img");
            image.src = "myart/" + file.name;
            image.alt = file.name;
            item.appendChild(image);
        }

        if (file.type === "video") {
            const video = document.createElement("video");
            video.src = "myart/" + file.name;
            video.controls = true;
            video.preload = "metadata";
            item.appendChild(video);
        }

        gallery.appendChild(item);
    });

    // 2. FETCH PROJECTS FROM JSON
    const projectsContainer = document.getElementById("projects");

    fetch('projects.json')
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP status: ${response.status}`);
            }
            return response.json();
        })
        .then(projects => {
            projects.forEach(project => {
                const a = document.createElement("a");
                a.className = "link";
                a.href = project.url;
                a.textContent = project.title;

                if (project.url.startsWith("http")) {
                    a.target = "_blank";
                    a.rel = "noopener noreferrer";
                }

                projectsContainer.appendChild(a);
            });
        })
        .catch(error => {
            console.error("Error loading projects.json:", error);
        });

    </script>


    <!-- FULLSCREEN IMAGE VIEWER SCRIPT -->

    <script>

        const imageViewer = document.getElementById("imageViewer");
        const viewerImage = document.getElementById("viewerImage");

        document.addEventListener("dblclick", function(event) {
            if (event.target.tagName === "IMG" && event.target.closest(".gallery")) {
                viewerImage.src = event.target.src;
                viewerImage.alt = event.target.alt;
                imageViewer.classList.add("active");
            }
        });

        imageViewer.addEventListener("click", function(event) {
            if (event.target === imageViewer) {
                imageViewer.classList.remove("active");
                viewerImage.src = "";
            }
        });

        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape") {
                imageViewer.classList.remove("active");
                viewerImage.src = "";
            }
        });

    </script>

</body>

</html>
