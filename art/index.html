<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Art</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <a class="back" href="../index.html">
        ← back
    </a>

    <main class="art">

        <!-- MY ART -->

        <section class="window">

            <h1 class="window-title">
                My Art
            </h1>

            <div class="gallery" id="gallery" aria-live="polite"></div>
            <noscript>Enable JavaScript to view the gallery.</noscript>

        </section>

        <!-- PROJECTS -->

        <section class="window">

            <h1 class="window-title">
                Projects I Worked On
            </h1>

            <div id="project-links" aria-live="polite"></div>

        </section>

    </main>

    <!-- IMAGE VIEWER -->

    <div class="image-viewer" id="imageViewer" role="dialog" aria-modal="true" aria-label="Artwork preview" tabindex="-1">

        <img id="viewerImage" alt="">

    </div>

    <script type="module" src="../js/art.js"></script>

</html>
